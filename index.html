<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Le Parcours RQTH — Jeu de piste</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- Statistiques de visites, anonymes et sans cookies (RGPD) -->
<script data-goatcounter="https://handigames.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>
@font-face{
  font-family:'OpenDyslexic';
  font-style:normal; font-weight:400; font-display:swap;
  src:url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-400-normal.woff2) format('woff2');
}
@font-face{
  font-family:'OpenDyslexic';
  font-style:normal; font-weight:700; font-display:swap;
  src:url(https://cdn.jsdelivr.net/fontsource/fonts/opendyslexic@latest/latin-700-normal.woff2) format('woff2');
}

/* =====================================================================
   SYSTÈME DE TOKENS SÉMANTIQUES
   Chaque rôle (surface, texte, accent...) est défini explicitement pour
   le thème clair ET le thème sombre, plutôt que dérivé par opacité.
   Tous les ratios de contraste texte/fond ont été vérifiés ≥ 4.5:1.
   ===================================================================== */
:root{
  /* surfaces */
  --surface-page:#FFF7EC;
  --surface-card:#FFFFFF;
  --surface-muted:#FFEDD6;
  --surface-border:#E8D2AE;

  /* texte */
  --text-primary:#2B2440;
  --text-secondary:#5A5266;     /* contraste ≥ 6.3:1 sur surface-page et surface-card */
  --text-on-accent:#FFFFFF;

  /* accents — chaque accent a une variante "forte" garantie ≥4.5:1 sur fond clair */
  --accent-coral:#C23B22;
  --accent-coral-strong:#9C2E19;
  --accent-teal:#0E7C6B;
  --accent-teal-strong:#0A5F51;
  --accent-violet:#5B3FA0;
  --accent-violet-strong:#46307D;
  --accent-sun:#8A6000;
  --accent-sun-pop:#FFC93C;     /* décoratif uniquement, jamais utilisé comme texte */

  --stamp:#0E7C6B;
  --warn:#B45309;
  --focus-ring:#1450C4;

  /* couleurs dédiées aux encadrés de retour (bonne/mauvaise réponse, info) :
     fonds clairs et unis + couleur d'encre bien plus sombre que le fond,
     pour un contraste fort. Le vert et l'orange sont volontairement choisis
     dans des familles de teintes différentes (bleu-vert vs orange-ambré)
     afin de rester distinguables en cas de daltonisme (deutéranopie/
     protanopie) ; chaque état porte aussi une icône et un style de bordure
     différents, pour ne jamais dépendre de la couleur seule. */
  --fb-good-bg:#E1F3E8;
  --fb-good-ink:#0F6B3F;
  --fb-warn-bg:#FCEAD4;
  --fb-warn-ink:#8A4B05;
  --fb-info-bg:#EAE3FA;
  --fb-info-ink:#3F2A78;

  --font-display:'Fredoka','Nunito',sans-serif;
  --font-body:'Nunito','Segoe UI',sans-serif;
  --fs-scale:1;
  --radius-lg:22px;
  --radius-md:16px;
}

html[data-theme="dark"]{
  --surface-page:#1D1730;
  --surface-card:#2A2046;
  --surface-muted:#332862;
  --surface-border:#4A3C72;

  --text-primary:#F1E9FF;
  --text-secondary:#C7B9E8;     /* contraste ≥ 7:1 sur surface-page et surface-card en sombre */
  --text-on-accent:#1D1730;

  --accent-coral:#FF8F73;
  --accent-coral-strong:#FFB199;
  --accent-teal:#5FE0C8;
  --accent-teal-strong:#8CEFDD;
  --accent-violet:#C7B3FF;
  --accent-violet-strong:#D9CBFF;
  --accent-sun:#FFD166;
  --accent-sun-pop:#FFD166;

  --stamp:#5FE0C8;
  --warn:#FFB86B;
  --focus-ring:#9DC0FF;

  --fb-good-bg:#163A2A;
  --fb-good-ink:#7CEAB4;
  --fb-warn-bg:#3B2710;
  --fb-warn-ink:#FFCB8E;
  --fb-info-bg:#2A2152;
  --fb-info-ink:#DCCEFF;
}

html[data-font="verdana"]{ --font-body: Verdana, Geneva, sans-serif; --font-display: Verdana, Geneva, sans-serif; }
html[data-font="opendyslexic"]{ --font-body: 'OpenDyslexic', Verdana, sans-serif; --font-display: 'OpenDyslexic', Verdana, sans-serif; }

html[data-size="small"]{ --fs-scale: 0.88; }
html[data-size="medium"]{ --fs-scale: 1; }
html[data-size="large"]{ --fs-scale: 1.22; }
html[data-size="xlarge"]{ --fs-scale: 1.45; }

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }

html{ font-size: calc(16px * var(--fs-scale)); }

html,body{
  background:var(--surface-page);
  color:var(--text-primary);
  font-family: var(--font-body);
  min-height:100vh;
}

body{
  background-image:
    radial-gradient(circle at 14% 6%, color-mix(in srgb, var(--accent-sun-pop) 18%, transparent), transparent 42%),
    radial-gradient(circle at 88% 14%, color-mix(in srgb, var(--accent-violet) 14%, transparent), transparent 40%),
    radial-gradient(circle at 80% 92%, color-mix(in srgb, var(--accent-coral) 10%, transparent), transparent 45%);
  transition: background-color 0.2s, color 0.2s;
}

h1,h2,h3{ font-family: var(--font-display); font-weight:700; letter-spacing:0.01em; }

.label{
  font-family:'Nunito',sans-serif; text-transform:uppercase; font-weight:800;
  letter-spacing:0.1em; font-size:0.78em; color:var(--accent-teal-strong);
}

.ico-svg{ width:1.05em; height:1.05em; vertical-align:-0.16em; flex-shrink:0; display:inline-block; }
.right-item .ico .ico-svg{ width:1.3em; height:1.3em; vertical-align:-0.2em; }
.stamp-mark .ico-svg{ width:1.1em; height:1.1em; vertical-align:-0.18em; }


a{ color:inherit; }

/* ---------- FOCUS VISIBLE (WCAG 2.4.7) ---------- */
:focus{ outline:none; }
:focus-visible{
  outline: 3px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: 6px;
}

[data-focus]:focus{ outline:none; }
.skip-link{
  position:absolute; left:-9999px; top:0; background:var(--focus-ring); color:#fff;
  padding:0.6rem 1rem; z-index:200; border-radius:0 0 8px 0;
}
.skip-link:focus{ left:0; }

/* ---------- SHELL ---------- */
#app{ min-height:100vh; display:flex; flex-direction:column; }

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:0.6rem;
  padding:0.8rem 1.1rem; border-bottom:3px solid var(--surface-border);
  background:var(--surface-page); position:sticky; top:0; z-index:50;
  flex-wrap:wrap;
}
.topbar-left{ display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:0.65rem; }
.brand .mark{
  width:42px; height:42px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; flex-shrink:0;
  background:var(--surface-card);
  box-shadow: 3px 3px 0 var(--surface-border);
}
.brand .mark img{ width:100%; height:100%; object-fit:contain; display:block; }
.brand .name{ font-size:1.08em; font-weight:700; font-family:var(--font-display); }
.brand .sub{ font-size:0.7em; color:var(--accent-teal-strong); font-weight:800; letter-spacing:0.06em; }

.back-btn{
  display:none; align-items:center; gap:0.35rem;
  border:2px solid var(--surface-border); background:var(--surface-card); color:var(--text-primary);
  font-weight:700; font-size:0.85em; letter-spacing:0.02em;
  padding:0.45rem 0.85rem; border-radius:20px; cursor:pointer;
  transition: transform 0.15s, border-color 0.15s, color 0.15s;
}
.back-btn.show{ display:inline-flex; }
.back-btn:hover{ border-color:var(--accent-coral); color:var(--accent-coral); transform: translateX(-2px); }

.topbar-right{ display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }

.mode-switch{ display:flex; gap:0.4rem; background:var(--surface-muted); border-radius:20px; padding:0.25rem; }
.mode-switch button{
  border:none; background:transparent; color:var(--text-primary);
  font-weight:800; font-size:0.78em; letter-spacing:0.03em;
  padding:0.4rem 0.8rem; border-radius:16px; cursor:pointer; text-transform:uppercase;
  transition: background 0.15s, color 0.15s;
}
.mode-switch button[aria-pressed="true"]{ background:var(--accent-teal); color:var(--text-on-accent); }

.icon-btn{
  border:2px solid var(--surface-border); background:var(--surface-card); color:var(--text-primary);
  width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:1.1rem;
  display:flex; align-items:center; justify-content:center;
  transition: transform 0.2s, background 0.15s, color 0.15s;
}
.icon-btn[aria-pressed="true"]{ background:var(--accent-violet); color:var(--text-on-accent); border-color:var(--accent-violet); }
.icon-btn:hover{ transform: rotate(15deg); }

main{ flex:1; max-width:760px; width:100%; margin:0 auto; padding:1.1rem 1rem 3rem; }

/* ---------- PRÉFÉRENCES PANEL — hiérarchie renforcée ---------- */
.prefs-panel{
  display:none; background:var(--surface-card); border:3px solid var(--surface-border); border-radius:var(--radius-lg);
  padding:1.4rem; margin: 0.8rem auto 0; max-width:760px;
}
.prefs-panel.open{ display:block; animation: popIn 0.25s ease; }
@keyframes popIn{ from{opacity:0; transform:scale(0.97) translateY(-4px);} to{opacity:1; transform:scale(1) translateY(0);} }

.prefs-row{ padding-bottom:1.3rem; margin-bottom:1.3rem; border-bottom:2px dashed var(--surface-border); }
.prefs-row:last-of-type{ border-bottom:none; margin-bottom:0; padding-bottom:0; }

.prefs-row .label{ display:flex; align-items:center; gap:0.4rem; margin-bottom:0.7rem; }
.prefs-row .label .pref-icon{ font-size:1.1em; }
.prefs-options{ display:flex; gap:0.5rem; flex-wrap:wrap; }
.prefs-options button{
  border:2px solid var(--surface-border); background:var(--surface-muted); color:var(--text-primary);
  padding:0.55rem 1rem; border-radius:14px; cursor:pointer; font-family:inherit; font-size:0.92em; font-weight:700;
  transition: transform 0.15s, border-color 0.15s, background 0.15s, color 0.15s;
}
.prefs-options button[aria-pressed="true"]{ border-color:var(--accent-teal); background:var(--accent-teal); color:var(--text-on-accent); }
.prefs-options button:hover{ transform: translateY(-1px); }

.prefs-close{
  margin-top:1.4rem; width:auto; display:block; margin-left:auto;
  background:transparent; color:var(--text-secondary); border:1.5px solid var(--surface-border);
  padding:0.5rem 1.1rem; border-radius:12px; font-family:inherit; font-weight:700; cursor:pointer; font-size:0.85em;
}
.prefs-close:hover{ color:var(--text-primary); border-color:var(--text-secondary); }

/* ---------- PROGRESS MAP ---------- */
.chapter-bar{
  display:flex; gap:0.4rem; overflow-x:auto; padding-bottom:0.6rem; margin-bottom:1rem;
  scrollbar-width:thin;
}
.chapter-chip{
  flex-shrink:0; font-weight:800; font-size:0.72em; letter-spacing:0.02em;
  padding:0.4rem 0.75rem; border-radius:20px; border:2px solid var(--surface-border); color:var(--text-secondary);
  white-space:nowrap; background:var(--surface-card);
}
.chapter-chip.current{ border-color:var(--accent-coral); color:var(--accent-coral); }
.chapter-chip.done{ border-color:var(--stamp); color:var(--stamp); background: color-mix(in srgb, var(--stamp) 12%, var(--surface-card)); }

/* ---------- BARRE DE PROGRESSION GLOBALE (gamification) ---------- */
.global-progress{
  display:flex; align-items:center; gap:0.7rem; margin-bottom:1.1rem;
  background:var(--surface-card); border:2.5px solid var(--surface-border); border-radius:18px;
  padding:0.6rem 1rem;
}
.global-progress .gp-track{
  flex:1; height:12px; border-radius:8px; background:var(--surface-muted); overflow:hidden; position:relative;
}
.global-progress .gp-fill{
  height:100%; border-radius:8px; background: linear-gradient(90deg, var(--accent-teal), var(--accent-coral));
  transition: width 0.5s ease;
}
.global-progress .gp-label{ font-weight:800; font-size:0.82em; white-space:nowrap; }
.global-progress .gp-badge{
  font-size:0.78em; font-weight:800; background:var(--surface-muted); padding:0.25rem 0.6rem; border-radius:10px;
  white-space:nowrap;
}

.route-strip{
  display:grid; grid-template-columns:repeat(12,1fr); gap:5px;
  margin:0 0 1.4rem;
}
.route-node{ height:9px; border-radius:6px; background:var(--surface-border); transition: background 0.3s; }
.route-node.current{ background:var(--accent-coral); }
.route-node.done{ background:var(--stamp); }

/* ---------- CARDS ---------- */
.sheet{
  background:var(--surface-card); border:3px solid var(--surface-border); border-radius:var(--radius-lg); padding:2.1rem;
  position:relative; box-shadow:5px 6px 0 var(--surface-border);
}
.sheet + .sheet{ margin-top:1.2rem; }

.station-eyebrow{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.7rem; flex-wrap:wrap; gap:0.4rem; }
.station-num{ font-family:var(--font-display); color:var(--accent-coral); font-weight:700; font-size:0.95em; }
.station-title{ font-size:1.55em; line-height:1.2; margin-bottom:0.35rem; }

.station-head-row{ display:flex; align-items:center; gap:0.9rem; margin-bottom:0.2rem; }
.station-head-row .station-title{ margin-bottom:0; flex:1; }
.station-illustration{
  width:64px; height:64px; border-radius:18px; flex-shrink:0; color:#fff;
  display:flex; align-items:center; justify-content:center; transform:rotate(-4deg);
  box-shadow:3px 3px 0 rgba(0,0,0,0.18);
}
.station-illustration .ico-svg{ width:32px; height:32px; }

.format-tag{
  font-weight:800; font-size:0.7em; letter-spacing:0.03em;
  padding:0.25rem 0.65rem; border-radius:12px; text-transform:uppercase;
}
.format-tag.qcm{ background: color-mix(in srgb, var(--accent-teal) 20%, var(--surface-card)); color:var(--accent-teal-strong); }
.format-tag.vf{ background: color-mix(in srgb, var(--accent-coral) 18%, var(--surface-card)); color:var(--accent-coral-strong); }
.format-tag.situation{ background: color-mix(in srgb, var(--accent-violet) 18%, var(--surface-card)); color:var(--accent-violet-strong); }
.format-tag.debat{ background: color-mix(in srgb, var(--accent-sun-pop) 32%, var(--surface-card)); color:var(--accent-sun); }

.q-progress{ font-weight:700; font-size:0.85em; color:var(--text-secondary); margin-bottom:0.8rem; }

.q-head{ display:flex; align-items:flex-start; gap:0.6rem; }
.q-text{ font-size:1.12em; font-weight:700; margin-bottom:1.15rem; line-height:1.5; flex:1; }
.q-situation{
  background:var(--surface-muted); border-left:4px solid var(--accent-violet); padding:0.85rem 1.05rem;
  font-size:1em; font-weight:600; margin-bottom:1.05rem; border-radius:0 var(--radius-md) var(--radius-md) 0; flex:1;
}

.speak-btn{
  flex-shrink:0; border:2px solid var(--surface-border); background:var(--surface-muted); color:var(--accent-teal-strong);
  width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:1em;
  display:flex; align-items:center; justify-content:center;
}
.speak-btn.speaking{ background:var(--accent-coral); color:var(--text-on-accent); border-color:var(--accent-coral); animation: pulse 0.8s infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }

.options{ display:flex; flex-direction:column; gap:0.85rem; }
.opt-btn{
  text-align:left; background:var(--surface-muted); border:2.5px solid var(--surface-border); border-radius:var(--radius-md);
  padding:1.1rem 1.25rem; font-size:1.06em; cursor:pointer; font-family:inherit; font-weight:600; color:var(--text-primary);
  transition: background 0.15s, border-color 0.15s, transform 0.12s;
}
.opt-btn:hover{ border-color:var(--accent-teal); transform: translateX(3px) scale(1.01); }
.opt-btn:active{ transform: scale(0.98); }
.opt-btn.correct{ background:var(--accent-teal-strong); color:var(--text-on-accent); border-color:var(--accent-teal-strong); animation: bounce 0.4s ease; }
.opt-btn.wrong{ background:var(--fb-warn-bg); color:var(--text-primary); border:3px dashed var(--fb-warn-ink); animation: shake 0.35s ease; }
.opt-mark{ display:inline-flex; vertical-align:middle; margin-right:0.5rem; }
.opt-mark .ico-svg{ width:1.25em; height:1.25em; }
.opt-btn.wrong .opt-mark{ color:var(--fb-warn-ink); }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.fb-title{ display:flex; align-items:center; gap:0.5rem; font-family:var(--font-display); font-weight:700; font-size:1.05em; margin-bottom:0.5rem; }
.fb-title .ico-svg{ width:1.4em; height:1.4em; }
.feedback.good .fb-title .ico-svg{ color:var(--fb-good-ink); }
.feedback.bad .fb-title .ico-svg{ color:var(--fb-warn-ink); }
.feedback.neutral .fb-title .ico-svg{ color:var(--fb-info-ink); }
.feedback:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:3px; }
.opt-btn:disabled{ cursor:default; }
@keyframes bounce{ 0%{transform:scale(1);} 40%{transform:scale(1.04);} 100%{transform:scale(1);} }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }

.vf-row{ display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; }
.vf-row .opt-btn{ text-align:center; font-weight:800; }

.debate-prompt{
  background:var(--surface-muted); border-left:4px solid var(--accent-sun-pop); padding:0.95rem 1.05rem; border-radius:0 var(--radius-md) var(--radius-md) 0;
  font-size:1em; margin-bottom:1.05rem; font-weight:600;
}
.debate-btn{
  width:100%; background:var(--accent-violet); color:var(--text-on-accent); border:none; padding:0.9rem; border-radius:var(--radius-md);
  font-family:var(--font-display); font-weight:700; cursor:pointer; font-size:1.02em;
  transition: background 0.15s;
}
.debate-btn:hover{ background:var(--accent-violet-strong); }

.feedback{
  margin-top:1.15rem; padding:1.05rem 1.15rem; border-radius:var(--radius-md); font-size:1em; line-height:1.55; display:none;
  font-weight:600;
}
.feedback.show{ display:block; animation:rise 0.35s ease; }
.feedback.good{ background: var(--fb-good-bg); border-left:5px solid var(--fb-good-ink); }
.feedback.bad{ background: var(--fb-warn-bg); border-left:5px dashed var(--fb-warn-ink); }
.feedback.neutral{ background: var(--fb-info-bg); border-left:5px solid var(--fb-info-ink); }
@keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  .opt-btn:hover, .chapter-card:hover, .icon-btn:hover, .back-btn:hover, .next-btn:hover, .prefs-options button:hover{ transform:none !important; }
}

.right-info{ margin-top:0.9rem; padding-top:0.9rem; border-top:2px dashed var(--surface-border); font-size:0.92em; font-weight:400; }
.right-info strong{ color:var(--accent-teal-strong); }

.step-nav{ display:flex; gap:0.6rem; margin-top:1.2rem; }
.next-btn{
  flex:1; background:var(--accent-coral); color:var(--text-on-accent); border:none;
  padding:0.95rem; border-radius:var(--radius-md); font-size:1.05em; font-weight:700; font-family:var(--font-display);
  cursor:pointer; display:none; transition: background 0.15s, transform 0.15s;
}
.next-btn.show{ display:block; }
.next-btn:hover{ background:var(--accent-coral-strong); transform: translateY(-1px); }
.prev-step-btn{
  display:none; background:var(--surface-muted); color:var(--text-primary); border:2.5px solid var(--surface-border);
  padding:0.95rem 1.1rem; border-radius:var(--radius-md); font-size:0.96em; font-weight:700; font-family:inherit; cursor:pointer;
  transition: border-color 0.15s, color 0.15s;
}
.prev-step-btn.show{ display:block; }
.prev-step-btn:hover{ border-color:var(--accent-teal); color:var(--accent-teal-strong); }

.stamp-mark{
  position:absolute; top:1.1rem; right:1.2rem; width:62px; height:62px; border:4px solid var(--stamp);
  border-radius:50%; color:var(--stamp); display:none; align-items:center; justify-content:center;
  transform:rotate(-14deg); font-family:var(--font-display); font-size:0.58em; font-weight:700;
  text-align:center; line-height:1.1;
}
.stamp-mark.show{ display:flex; animation: stampIn 0.4s ease; }
@keyframes stampIn{ from{ transform: rotate(-14deg) scale(1.8); opacity:0; } to{ transform: rotate(-14deg) scale(1); opacity:1; } }

/* ---------- ENTRY ---------- */
.entry-wrap{ text-align:center; padding:1.9rem 0 1rem; }
.entry-wrap .kicker{ font-weight:800; letter-spacing:0.12em; color:var(--accent-teal-strong); font-size:0.82em; margin-bottom:0.6rem; }
.entry-wrap h1{ font-size:2em; line-height:1.18; margin-bottom:0.8rem; }
.entry-wrap h1 .accent{ color:var(--accent-coral); }
.entry-wrap p.lede{ color:var(--text-secondary); max-width:480px; margin:0 auto 1.5rem; font-size:1.02em; font-weight:600; }

.entry-cartouche{
  background:var(--surface-card); border:3px solid var(--surface-border); border-radius:var(--radius-lg);
  padding:1.8rem 1.6rem; margin:0 auto 1.6rem; max-width:560px;
  box-shadow:5px 6px 0 var(--surface-border);
  position:relative; overflow:hidden;
}
.entry-cartouche::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 8% 0%, color-mix(in srgb, var(--accent-sun-pop) 22%, transparent), transparent 45%),
    radial-gradient(circle at 100% 100%, color-mix(in srgb, var(--accent-coral) 14%, transparent), transparent 50%);
  pointer-events:none;
}
.entry-cartouche > *{ position:relative; }
.entry-cartouche p.lede{ margin-bottom:0; }

.chapter-grid{ display:flex; flex-direction:column; gap:1.2rem; margin-top:1rem; text-align:left; }

/* chaque carte porte une bande colorée à gauche + un fond très légèrement teinté
   pour gagner du poids visuel propre, distinct des autres cartes du parcours */
.chapter-card{
  position:relative; overflow:hidden;
  background:var(--surface-card); border:3px solid var(--surface-border); border-radius:var(--radius-lg);
  padding:1.8rem 1.6rem 1.8rem 2.1rem; min-height:128px;
  display:flex; align-items:center; gap:1.3rem; cursor:pointer; width:100%; font-family:inherit; color:var(--text-primary);
  box-shadow: 4px 4px 0 var(--surface-border);
  transition: transform 0.15s, box-shadow 0.15s;
}
.chapter-card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:8px;
  background: var(--chapter-color, var(--accent-coral));
}
.chapter-card{ background-image: linear-gradient(90deg, color-mix(in srgb, var(--chapter-color, var(--accent-coral)) 7%, var(--surface-card)), var(--surface-card) 60%); }
.chapter-card:hover{ transform: translate(-2px,-3px); box-shadow: 6px 8px 0 var(--chapter-color, var(--accent-coral)); }
.chapter-card--done{ cursor:not-allowed; }
.chapter-card--done:hover{ transform:none; box-shadow:4px 4px 0 var(--surface-border); }

.chapter-card:nth-child(1){ --chapter-color: var(--accent-coral); }
.chapter-card:nth-child(2){ --chapter-color: var(--accent-violet); }
.chapter-card:nth-child(3){ --chapter-color: var(--accent-teal); }
.chapter-card:nth-child(4){ --chapter-color: var(--accent-sun); }
.chapter-card:nth-child(5){ --chapter-color: var(--accent-coral-strong); }
.chapter-card:nth-child(6){ --chapter-color: var(--accent-violet-strong); }

.chapter-card .cnum{
  position:relative; font-family:var(--font-display); font-weight:700; color:var(--text-on-accent); font-size:1.45em; flex-shrink:0; width:60px; height:60px;
  border-radius:18px; display:flex; align-items:center; justify-content:center; transform: rotate(-4deg);
  background: var(--chapter-color, var(--accent-coral));
  box-shadow:3px 3px 0 rgba(0,0,0,0.18);
  transition: transform 0.2s;
}
.chapter-card .cnum .ico-svg{ width:30px; height:30px; }
.chapter-card .cnum-badge{
  position:absolute; bottom:-7px; right:-7px; width:22px; height:22px; border-radius:8px;
  background:var(--surface-card); color:var(--text-primary); font-size:0.62em; font-weight:800;
  display:flex; align-items:center; justify-content:center; transform:rotate(4deg);
  border:2px solid var(--chapter-color, var(--accent-coral)); box-shadow:1px 1px 0 var(--surface-border);
}
.chapter-card:hover .cnum{ transform: rotate(4deg) scale(1.08); }
.chapter-card .ctxt{ text-align:left; flex:1; }
.chapter-card .ctxt strong{ display:block; font-size:1.32em; margin-bottom:0.3rem; font-family:var(--font-display); }
.chapter-card .ctxt span{ font-size:1em; color:var(--text-secondary); font-weight:600; }
.chapter-card .ccount{ font-weight:800; font-size:0.9em; color:var(--text-secondary); flex-shrink:0; text-align:center; background:var(--surface-muted); padding:0.55rem 1rem; border-radius:14px; }
.chapter-card .ccount .ccheck{ display:block; font-size:1.1em; color:var(--stamp); margin-top:0.15rem; }

.entry-hint{ font-size:0.85em; color:var(--text-secondary); margin-top:1.3rem; font-weight:600; }

/* ---------- FINAL ---------- */
.passport{ background:var(--surface-card); border:3px solid var(--surface-border); }
.passport h2{ font-size:1.65em; margin-bottom:0.4rem; }
.passport .score-line{ font-weight:800; color:var(--accent-teal-strong); margin-bottom:1.3rem; font-size:0.95em; }
.rights-list{ display:flex; flex-direction:column; gap:0.9rem; margin:1.1rem 0; }
.right-item{ display:flex; gap:0.85rem; align-items:flex-start; padding:1rem; background:var(--surface-muted); border-radius:var(--radius-md); }
.right-item .ico{ width:30px; flex-shrink:0; text-align:center; font-size:1.3em; padding-top:0.1rem; color:var(--accent-teal-strong); }
.right-item .txt strong{ display:block; margin-bottom:0.15rem; font-family:var(--font-display); }
.right-item .txt span{ font-size:0.88em; color:var(--text-secondary); font-weight:600; }

.resource-box{ background:var(--accent-teal); color:var(--text-on-accent); border-radius:var(--radius-lg); padding:1.4rem; text-align:center; margin-top:1.4rem; }
.resource-box h3{ color:inherit; margin-bottom:0.4rem; }
.resource-box p{ font-size:0.9em; opacity:0.92; margin-bottom:1rem; font-weight:600; }
.qr-block{
  width:132px; height:132px; margin:0 auto 0.8rem;
  background:#fff; border-radius:14px; padding:8px; box-sizing:border-box;
  display:block; object-fit:contain;
}
.qr-note{ font-size:0.72em; letter-spacing:0.04em; opacity:0.85; font-weight:700; }

.restart-btn{
  margin-top:1.4rem; width:100%; background:transparent; border:3px solid var(--accent-teal); color:var(--accent-teal-strong);
  padding:0.85rem; border-radius:var(--radius-md); font-family:var(--font-display); font-weight:700; cursor:pointer; font-size:1em;
  transition: background 0.15s, color 0.15s;
  display:flex; align-items:center; justify-content:center; gap:0.5rem;
}
.restart-btn:hover{ background:var(--accent-teal); color:var(--text-on-accent); }
.restart-btn.download-btn{ background:var(--accent-coral); border-color:var(--accent-coral); color:var(--text-on-accent); }
.restart-btn.download-btn:hover{ background:var(--accent-coral-strong); border-color:var(--accent-coral-strong); }

.badge-block{ text-align:center; margin:0.2rem 0 1.6rem; }
.badge-block .badge-icon{
  width:76px; height:76px; margin:0 auto 0.8rem; border-radius:50%;
  background:linear-gradient(145deg, var(--accent-sun-pop), var(--accent-coral));
  display:flex; align-items:center; justify-content:center; color:#fff;
  box-shadow:0 4px 0 var(--accent-coral-strong);
}
.badge-block .badge-icon .ico-svg{ width:40px; height:40px; }
.badge-block h3{ font-size:1.35em; margin-bottom:0.3rem; }
.badge-block p{ color:var(--text-secondary); font-weight:600; font-size:0.95em; }

.cert-box{ background:var(--surface-muted); border:2.5px dashed var(--accent-violet); border-radius:var(--radius-lg); padding:1.3rem; margin-top:1.4rem; }
.cert-box .cert-label{ margin-bottom:0.8rem; }
.cert-form{ display:flex; gap:0.6rem; flex-wrap:wrap; }
.cert-form input{
  flex:1; min-width:160px; padding:0.75rem 1rem; border-radius:12px; border:2px solid var(--surface-border);
  font-family:inherit; font-size:1em; background:var(--surface-card); color:var(--text-primary);
}
.cert-form input:focus-visible{ outline:3px solid var(--focus-ring); outline-offset:2px; }
.cert-form button{
  background:var(--accent-violet); color:var(--text-on-accent); border:none; padding:0.75rem 1.2rem; border-radius:12px;
  font-family:var(--font-display); font-weight:700; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:0.4rem;
  transition: background 0.15s;
}
.cert-form button:hover{ background:var(--accent-violet-strong); }

/* ---------- CONSIGNE JOUEUR ---------- */
.consigne{
  display:flex; gap:1rem; align-items:flex-start; margin-bottom:1.1rem;
  background:var(--surface-card); border:3px solid var(--accent-sun-pop); border-radius:var(--radius-lg);
  padding:1.2rem 1.3rem; box-shadow:4px 5px 0 var(--surface-border);
}
.consigne-ico{
  width:48px; height:48px; border-radius:15px; flex-shrink:0; color:#2B2440;
  background:var(--accent-sun-pop); display:flex; align-items:center; justify-content:center;
  transform:rotate(-4deg);
}
.consigne-ico .ico-svg{ width:26px; height:26px; }
.consigne-body strong{ font-family:var(--font-display); font-size:1.1em; display:block; margin-bottom:0.3rem; }
.consigne-body p{ font-weight:600; font-size:0.95em; line-height:1.5; color:var(--text-secondary); margin-bottom:0.9rem; }
.consigne-btn{
  display:inline-flex; align-items:center; gap:0.4rem; cursor:pointer;
  background:var(--accent-teal); color:var(--text-on-accent); border:none; border-radius:12px;
  padding:0.65rem 1.1rem; font-family:var(--font-display); font-weight:700; font-size:0.95em;
}
.consigne-btn:hover{ background:var(--accent-teal-strong); }
@media (max-width:600px){ .consigne{ flex-direction:column; } }

/* ---------- QR UNIQUE + ÉTAPES ---------- */
.qr-frame{
  width:196px; margin:0 auto 0.8rem; padding:10px; border-radius:26px;
  background:linear-gradient(145deg,#D9A27A,#B9764F);
  box-shadow:0 5px 0 rgba(0,0,0,0.22);
}
.qr-frame .qr-block{ width:100%; height:auto; aspect-ratio:1/1; margin:0; padding:0; border-radius:16px; }
.how-steps{ display:grid; grid-template-columns:repeat(3,1fr); gap:0.6rem; margin-top:1.2rem; }
.how-step{
  display:flex; flex-direction:column; align-items:center; gap:0.4rem;
  font-weight:800; font-size:0.78em; line-height:1.25;
}
.how-ico{
  width:46px; height:46px; border-radius:16px; background:rgba(255,255,255,0.22);
  display:flex; align-items:center; justify-content:center;
}
.how-ico .ico-svg{ width:24px; height:24px; }

.fac-qr{ text-align:center; margin-top:1.4rem; }
.fac-qr h3{ margin:0.3rem 0 1rem; font-size:1.1em; }
.qr-frame-lg{ width:min(300px, 80%); padding:14px; border-radius:32px; }
.fac-qr-url{ margin-top:0.8rem; font-weight:800; font-size:0.9em; color:var(--accent-teal-strong); word-break:break-all; }

/* ---------- ÉCRAN DE VERROUILLAGE ANIMATEUR ---------- */
.lock-screen{ text-align:center; max-width:460px; margin:1.5rem auto 0; }
.lock-icon{
  width:72px; height:72px; margin:0 auto 1rem; border-radius:50%;
  background:var(--accent-violet); color:var(--text-on-accent);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 var(--accent-violet-strong);
}
.lock-icon .ico-svg{ width:34px; height:34px; }
.lock-screen h2{ font-size:1.5em; margin-bottom:0.5rem; }
.lock-text{ color:var(--text-secondary); font-weight:600; margin-bottom:1.3rem; }
.lock-form{ display:flex; flex-direction:column; gap:0.6rem; text-align:left; }
.lock-form input{
  padding:0.8rem 1rem; border-radius:12px; border:2px solid var(--surface-border);
  font-family:inherit; font-size:1.05em; background:var(--surface-card); color:var(--text-primary);
}
.lock-error{ min-height:1.3em; color:var(--accent-coral-strong); font-weight:800; font-size:0.9em; }
.lock-actions{ display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:0.3rem; }
.lock-actions button{
  flex:1; min-width:150px; padding:0.85rem 1rem; border-radius:var(--radius-md);
  font-family:var(--font-display); font-weight:700; font-size:1em; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:0.4rem;
}
.lock-submit{ background:var(--accent-violet); color:var(--text-on-accent); border:none; }
.lock-submit:hover{ background:var(--accent-violet-strong); }
.lock-cancel{ background:var(--surface-muted); color:var(--text-primary); border:2.5px solid var(--surface-border); }
.lock-cancel:hover{ border-color:var(--accent-teal); color:var(--accent-teal-strong); }

/* ---------- FACILITATOR ---------- */
.fac-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.2rem; gap:1rem; flex-wrap:wrap; }
.fac-header h1{ font-size:1.55em; }
.fac-header p{ color:var(--text-secondary); font-size:0.9em; max-width:420px; font-weight:600; }

.timer-box{ background:var(--accent-violet); color:var(--text-on-accent); border-radius:var(--radius-lg); padding:1rem 1.3rem; text-align:center; min-width:150px; }
.timer-box .t-label{ font-weight:800; font-size:0.66em; letter-spacing:0.1em; opacity:0.85; margin-bottom:0.3rem; }
.timer-box .t-val{ font-size:1.75em; font-weight:700; font-family:var(--font-display); }
.timer-box .t-controls{ display:flex; gap:0.4rem; justify-content:center; margin-top:0.6rem; }
.timer-box button{
  background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.35); color:inherit;
  border-radius:8px; padding:0.32rem 0.65rem; font-size:0.76em; font-weight:700; cursor:pointer; font-family:inherit;
}

.agenda{ display:flex; flex-direction:column; gap:0.7rem; margin-bottom:1.6rem; }
.agenda-item{
  display:grid; grid-template-columns:74px 1fr; gap:0.9rem; background:var(--surface-card); border:2.5px solid var(--surface-border);
  border-radius:var(--radius-md); padding:0.9rem 1rem; cursor:pointer; width:100%; text-align:left; font-family:inherit; color:var(--text-primary);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.agenda-item[aria-pressed="true"]{ border-color:var(--accent-coral); box-shadow:3px 3px 0 var(--accent-coral); }
.agenda-time{ font-weight:800; color:var(--accent-teal-strong); font-size:0.82em; align-self:center; }
.agenda-body strong{ display:block; font-size:0.98em; margin-bottom:0.15rem; font-family:var(--font-display); }
.agenda-body p{ font-size:0.85em; color:var(--text-secondary); font-weight:600; }

.qr-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:0.9rem; margin-top:1rem; }
@media(max-width:560px){ .qr-grid{ grid-template-columns:repeat(2,1fr); } }
.qr-card-mini{ background:var(--surface-card); border:2.5px solid var(--surface-border); border-radius:var(--radius-md); padding:0.9rem; text-align:center; }
.qr-card-mini .qr-block{ width:68px; height:68px; margin-bottom:0.5rem; border-radius:10px; padding:4px; }
.qr-card-mini strong{ font-size:0.78em; display:block; margin-bottom:0.15rem; }
.qr-card-mini span{ font-size:0.68em; color:var(--accent-teal-strong); font-weight:700; }

.printable-note{
  background:var(--surface-muted); border:2px dashed var(--accent-sun-pop); border-radius:var(--radius-md); padding:0.95rem 1.15rem;
  font-size:0.85em; color:var(--text-secondary); margin-top:1.2rem; font-weight:600;
}

footer{ text-align:center; padding:1.3rem; font-size:0.78em; color:var(--text-secondary); font-weight:700; }
footer .footer-legal{ display:flex; flex-direction:column; gap:0.15rem; font-size:0.95em; }
footer .footer-legal .fl-brand{ color:var(--accent-teal-strong); font-family:var(--font-display); letter-spacing:0.02em; }

/* ---------- RESPONSIVE ---------- */
@media (max-width:600px){
  main{ padding:0.9rem 0.6rem 2.5rem; }
  .sheet{ padding:1.5rem 1.15rem; }
  .entry-cartouche{ padding:1.7rem 1.2rem; }
  .chapter-card{ flex-wrap:wrap; padding:1.5rem 1.2rem 1.5rem 1.8rem; min-height:0; }
  .chapter-card .ctxt{ min-width:0; flex-basis:calc(100% - 60px - 1.3rem); }
  .chapter-card .ccount{ width:100%; text-align:left; }
  .brand .sub{ display:none; }
  .entry-wrap h1{ font-size:1.6em; }
  .station-title{ font-size:1.3em; }
  .station-illustration{ width:50px; height:50px; border-radius:14px; }
  .station-illustration .ico-svg{ width:26px; height:26px; }
  .vf-row{ grid-template-columns:1fr; }
  .fac-header{ flex-direction:column; }
  .timer-box{ width:100%; }
  .qr-grid{ grid-template-columns:repeat(2,1fr); }
  .step-nav{ flex-direction:column; }
  .global-progress{ flex-wrap:wrap; }
}
@media (max-width:380px){
  main{ padding:0.8rem 0.5rem 2.5rem; }
  .sheet{ padding:1.3rem 1rem; }
  .topbar{ padding:0.7rem 0.7rem; }
}

@media (forced-colors: active){
  .opt-btn, .sheet, .chapter-card, .agenda-item{ border:1px solid CanvasText; }
}
</style>
</head>

  { ico:icon("mapPin"), title:"Une démarche réversible", txt:"Tu peux demander la RQTH dès 16 ans, sans obligation de l'utiliser immédiatement, et la renouveler ou l'arrêter selon ta situation." }
];

const agendaPlan = [
  { time:"0–5 min", title:"Lancement", desc:"Accueil, présentation du parcours en 6 chapitres et 12 étapes, formation des équipes.", detail:"Affiche le QR code de l'affiche de présentation (ou projette-le). Forme des équipes de 2 à 4 jeunes. Précise que le parcours est organisé en 6 chapitres : Comprendre le handicap, Santé mentale, Études, Aides financières, Monde du travail, Faire sa demande." },
  { time:"5–10 min", title:"Mise en contexte", desc:"Courte introduction orale sur la RQTH et pourquoi ce sujet concerne les jeunes dès 16 ans.", detail:"Insiste sur 3 messages avant de lancer le jeu : la RQTH concerne aussi les handicaps invisibles, elle est confidentielle, et c'est une démarche réversible et gratuite. Préviens que le parcours mélange QCM, vrai/faux, mises en situation et temps de débat en équipe. Signale aussi les options d'accessibilité (police, taille de texte, thème, lecture vocale) disponibles via l'icône ⚙ en haut de l'écran." },
  { time:"10–45 min", title:"Le parcours (12 étapes, 24 questions)", desc:"Les équipes parcourent les étapes à leur rythme. Les questions \"débat\" demandent 2 minutes d'échange en équipe avant de continuer.", detail:"Circule entre les équipes, en particulier sur les étapes de débat (3, 7, 10) qui suscitent le plus de discussion. Les étapes santé mentale (4-5) et confidentialité méritent aussi un temps d'écoute si des jeunes réagissent personnellement." },
  { time:"45–53 min", title:"Débrief collectif", desc:"Retour en groupe sur les découvertes, les surprises, les questions de débat abordées.", detail:"Reprends les 3 questions de débat (âge minimum, RQTH en entretien, signaler son handicap en candidature) et demande aux équipes ce qu'elles en ont conclu. Corrige les dernières idées reçues persistantes." },
  { time:"53–60 min", title:"Clôture et ressources", desc:"Affichage de l'écran récapitulatif des droits, rappel du QR code de l'application à emporter.", detail:"Projette l'écran final (passeport des droits) en mode joueur. Rappelle que la démarche se fait à la MDPH, qu'aucune décision n'est à prendre dans l'immédiat, et que l'appli reste accessible après l'atelier grâce au QR code de l'affiche." }
];

/* ===================== ÉTAT ===================== */

let state = { mode:'player', screen:'entry', current:0, qIndex:0, done:{}, progress:{}, answers:{}, prenom:'', consigneSeen:false };
let history = [];
let timer = { seconds:3600, running:false, interval:null };
let prefs = { font:'default', size:'medium', theme:'light', voiceOn:false };
let activeAgendaIdx = 0;
let synthUtterance = null;

/* ===================== CODE ANIMATEUR =====================
   Modifie la valeur ci-dessous pour changer le code de déverrouillage.
   Le mode Animateur (déroulé, minuteur, QR codes des étapes) reste
   inaccessible tant que ce code n'est pas saisi. */
const FACILITATOR_CODE = "HANDILAB";
let facUnlocked = false;


function pushHistory(){
  history.push(JSON.parse(JSON.stringify({ mode:state.mode, screen:state.screen, current:state.current, qIndex:state.qIndex, agendaIdx:activeAgendaIdx })));
  updateBackButton();
}

function updateBackButton(){
  const btn = document.getElementById('back-btn');
  if(history.length > 0) btn.classList.add('show');
  else btn.classList.remove('show');
}

function goBack(){
  if(history.length === 0) return;
  const prev = history.pop();
  state.mode = prev.mode;
  state.screen = prev.screen;
  state.current = prev.current;
  state.qIndex = prev.qIndex;
  activeAgendaIdx = prev.agendaIdx;
  if(state.mode === 'player') facUnlocked = false;
  document.getElementById('btn-mode-player').setAttribute('aria-pressed', String(state.mode==='player'));
  document.getElementById('btn-mode-facilitator').setAttribute('aria-pressed', String(state.mode==='facilitator'));
  updateBackButton();
  render(false);
}

function setMode(m){
  if(state.mode === m) return;
  pushHistory();
  state.mode = m;
  if(m === 'player') facUnlocked = false;
  document.getElementById('btn-mode-player').setAttribute('aria-pressed', String(m==='player'));
  document.getElementById('btn-mode-facilitator').setAttribute('aria-pressed', String(m==='facilitator'));
  render(false);
}

function totalQuestions(){ return stations.reduce((acc,s)=>acc+s.questions.length,0); }

/* ===================== PRÉFÉRENCES ===================== */

const PREFS_KEY = 'rqth-prefs-v1';
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){}
}
function loadPrefs(){
  try{
    const raw = localStorage.getItem(PREFS_KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(['default','verdana','opendyslexic'].includes(p.font)) setFont(p.font);
    if(['small','medium','large','xlarge'].includes(p.size)) setSize(p.size);
    if(['light','dark'].includes(p.theme)) setTheme(p.theme);
    if(typeof p.voiceOn === 'boolean') setVoicePref(p.voiceOn);
  }catch(e){}
}

function togglePrefs(){
  const panel = document.getElementById('prefs-panel');
  const btn = document.getElementById('prefs-toggle');
  const open = panel.classList.toggle('open');
  btn.setAttribute('aria-expanded', String(open));
  btn.setAttribute('aria-pressed', String(open));
}

function setFont(f){
  prefs.font = f;
  savePrefs();
  document.documentElement.setAttribute('data-font', f);
  document.querySelectorAll('[data-font]').forEach(b => {
    if(b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset.font === f));
  });
}

function setSize(s){
  prefs.size = s;
  savePrefs();
  document.documentElement.setAttribute('data-size', s);
  document.querySelectorAll('[data-size]').forEach(b => {
    if(b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset.size === s));
  });
}

function setTheme(t){
  prefs.theme = t;
  savePrefs();
  if(t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('[data-theme]').forEach(b => {
    if(b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset.theme === t));
  });
}

function setVoicePref(on){
  prefs.voiceOn = on;
  savePrefs();
  document.querySelectorAll('[data-voice]').forEach(b => {
    b.setAttribute('aria-pressed', String((b.dataset.voice === 'on') === on));
  });
  render(false);
}

function speakText(text, btnEl){
  if(!('speechSynthesis' in window)){
    alert("La lecture vocale n'est pas disponible sur ce navigateur.");
    return;
  }
  if(window.speechSynthesis.speaking){
    window.speechSynthesis.cancel();
    document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
    if(synthUtterance && synthUtterance._btn === btnEl) { synthUtterance = null; return; }
  }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'fr-FR';
  utter.rate = 0.95;
  utter._btn = btnEl;
  synthUtterance = utter;
  if(btnEl) btnEl.classList.add('speaking');
  utter.onend = () => { if(btnEl) btnEl.classList.remove('speaking'); synthUtterance = null; };
  utter.onerror = () => { if(btnEl) btnEl.classList.remove('speaking'); synthUtterance = null; };
  window.speechSynthesis.speak(utter);
}

/* ===================== RENDU ===================== */

function renderLock(errorMsg){
  return `
    <div class="sheet lock-screen">
      <div class="lock-icon" aria-hidden="true">${icon('lock')}</div>
      <h2>Espace animateur</h2>
      <p class="lock-text">Cet espace est réservé à l'animateur. Saisis le code de déverrouillage pour continuer.</p>
      <form class="lock-form" onsubmit="return tryUnlock(event)" autocomplete="off">
        <label for="fac-code-input" class="label">Code animateur</label>
        <input id="fac-code-input" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" aria-describedby="fac-code-error" placeholder="Code">
        <div class="lock-error" id="fac-code-error" role="alert">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
        <div class="lock-actions">
          <button type="button" class="lock-cancel" onclick="cancelUnlock()">${icon('arrowLeft')} Retour au parcours</button>
          <button type="submit" class="lock-submit">${icon('check')} Déverrouiller</button>
        </div>
      </form>
    </div>`;
}

function tryUnlock(e){
  if(e) e.preventDefault();
  const input = document.getElementById('fac-code-input');
  const val = input ? input.value.trim() : '';
  if(val === FACILITATOR_CODE){
    facUnlocked = true;
    render(false);
  } else {
    const err = document.getElementById('fac-code-error');
    if(err) err.textContent = 'Code incorrect. Réessaie.';
    if(input){ input.value = ''; input.focus(); }
  }
  return false;
}

function cancelUnlock(){
  facUnlocked = false;
  setMode('player');
}

let initialised = false;
let lastFocusKey = null;
function currentViewKey(){
  return [state.mode, state.screen, state.current, state.qIndex, facUnlocked].join('|');
}
function focusAfterRender(){
  const key = currentViewKey();
  if(!initialised){ lastFocusKey = key; return; }
  if(key === lastFocusKey) return;
  lastFocusKey = key;
  const target = document.querySelector('#main [data-focus]');
  if(target){ target.focus(); window.scrollTo({ top:0 }); }
}
function render(recordHistory){
  renderView();
  focusAfterRender();
}

function renderView(){
  const main = document.getElementById('main');
  if(state.mode === 'facilitator'){
    if(!facUnlocked){
      main.innerHTML = renderLock('');
      const input = document.getElementById('fac-code-input');
      if(input) input.focus();
      return;
    }
    main.innerHTML = renderFacilitator();
    return;
  }
  if(state.screen === 'entry') main.innerHTML = renderEntry();
  else if(state.screen === 'station') main.innerHTML = renderStation(state.current, state.qIndex);
  else if(state.screen === 'final') main.innerHTML = renderFinal();
}

/* ---------- ENTRÉE ---------- */

function renderEntry(){
  const cards = chapters.map((c, idx) => {
    const range = c.stationRange;
    const stCount = range[1] - range[0] + 1;
    const qCount = stations.slice(range[0], range[1]+1).reduce((a,s)=>a+s.questions.length,0);
    const stationIdxs = Array.from({length:stCount}, (_,k)=>range[0]+k);
    const chapDone = stationIdxs.every(idx2 => state.done[idx2]);
    const cls = 'chapter-card' + (chapDone ? ' chapter-card--done' : '');
    const clickAttr = chapDone ? 'disabled aria-disabled="true"' : `onclick="goToStation(${range[0]})"`;
    const ariaLabel = chapDone ? ` aria-label="${c.title}, chapitre déjà terminé"` : '';
    return `
      <button class="${cls}" ${clickAttr}${ariaLabel}>
        <div class="cnum" aria-hidden="true">${icon(chapterIllustrations[c.id])}<span class="cnum-badge">${String(idx+1).padStart(2,'0')}</span></div>
        <div class="ctxt"><strong>${c.title}</strong><span>Étapes ${range[0]+1} à ${range[1]+1}</span></div>
        <div class="ccount">${stCount} étape${stCount>1?'s':''} · ${qCount} questions${chapDone ? '<span class="ccheck">' + icon('check') + ' Terminé</span>' : ''}</div>
      </button>`;
  }).join('');

  return `
    <div class="entry-wrap">
      <div class="entry-cartouche">
        <div class="kicker">${icon('sparkles')} C'est parti pour l'aventure</div>
        <h1 tabindex="-1" data-focus="1">12 étapes à explorer.<br><span class="accent">${totalQuestions()} questions</span> qui vont te surprendre.</h1>
        <p class="lede">Le parcours se joue en 6 chapitres et 12 étapes, un peu comme un jeu de piste. Choisis un chapitre pour te lancer, avance question après question grâce aux boutons « Suivant » et « Précédent », et amuse-toi : chaque bonne réponse t'en apprend un peu plus sur tes droits. Pas de stress : il n'y a pas de note, tu avances à ton rythme. Ta progression reste affichée tant que tu gardes la page ouverte.</p>
      </div>
      <div class="chapter-grid">${cards}</div>
      <p class="entry-hint">${icon('bulb')} Astuce animateur : chaque équipe peut démarrer où elle veut, l'appli affiche ce qui est déjà validé pendant la partie.</p>
    </div>
  `;
}

function goToStation(i){
  pushHistory();
  state.current = i;
  state.qIndex = 0;
  state.screen = 'station';
  render(false);
}

/* ---------- STATION ---------- */

function chapterChipsHtml(currentStationIdx){
  return chapters.map(c => {
    const [start,end] = c.stationRange;
    const allDone = Array.from({length:end-start+1}, (_,k)=>start+k).every(idx => state.done[idx]);
    const isCurrent = currentStationIdx >= start && currentStationIdx <= end;
    let cls = 'chapter-chip';
    if(allDone) cls += ' done';
    else if(isCurrent) cls += ' current';
    return `<div class="${cls}">${c.title}</div>`;
  }).join('');
}

function routeStripHtml(currentStationIdx){
  return stations.map((s, idx) => {
    let cls = 'route-node';
    if(state.done[idx]) cls += ' done';
    else if(idx === currentStationIdx) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function globalProgressHtml(){
  const totalQ = totalQuestions();
  const doneQ = Object.keys(state.progress).length;
  const pct = Math.round((doneQ / totalQ) * 100);
  const doneStations = Object.keys(state.done).length;
  return `
    <div class="global-progress" role="img" aria-label="Progression globale : ${doneQ} questions sur ${totalQ}, ${doneStations} étapes validées sur ${stations.length}">
      <span class="gp-label">${icon('flag')} ${pct}%</span>
      <div class="gp-track"><div class="gp-fill" style="width:${pct}%"></div></div>
      <span class="gp-badge">${doneStations}/${stations.length} étapes ${icon('star')}</span>
    </div>
  `;
}

function renderStation(i, qIdx){
  const s = stations[i];
  const q = s.questions[qIdx];
  const isStationDone = !!state.done[i];
  const qKey = i + '-' + qIdx;
  const alreadyAnswered = !!state.progress[qKey];
  const prevT = prevTarget(i, qIdx);
  const prevLocked = !!(prevT && state.progress[prevT.i + '-' + prevT.q]);
  const showPrevBtn = !!prevT && !prevLocked;
  const formatLabel = { qcm:"QCM", vf:"Vrai / Faux", situation:"Mise en situation", debat:"Débat d'équipe" };
  const speakHtml = prefs.voiceOn
    ? `<button class="speak-btn" type="button" aria-label="Écouter la question à voix haute" onclick='speakText(${JSON.stringify(q.question).replace(/'/g,"&#39;")}, this)'>${icon('speaker')}</button>`
    : '';

  let bodyHtml = '';
  let feedbackCls = '';
  let feedbackContent = '';

  if(q.format === 'debat'){
    bodyHtml = `
      <div class="debate-prompt">${q.prompt}</div>
      <div class="q-head"><div class="q-text">${q.question}</div>${speakHtml}</div>
      ${alreadyAnswered ? '' : `<button class="debate-btn" id="debate-reveal" onclick="revealDebate(${i},${qIdx})">Voir l'éclairage après discussion</button>`}
    `;
    if(alreadyAnswered){
      feedbackCls = 'show neutral';
      feedbackContent = `<div class="fb-title">${icon('chat')} <span>À retenir</span></div>${q.explication}<div class="right-info"><strong>Ton droit ici&nbsp;:</strong> ${q.droit}</div>`;
    }
  } else {
    const optClass = q.format === 'vf' ? 'options vf-row' : 'options';
    const chosenIdx = alreadyAnswered ? state.answers[qKey] : null;
    let optionsHtml = q.options.map((opt, idx) => {
      let cls = 'opt-btn';
      let markHtml = '';
      let disabledAttr = '';
      if(alreadyAnswered){
        disabledAttr = 'disabled';
        if(idx === q.correct){
          cls += ' correct';
          markHtml = optMarkHtml('correct');
        } else if(idx === chosenIdx){
          cls += ' wrong';
          markHtml = optMarkHtml('wrong');
        }
      }
      return `<button class="${cls}" data-idx="${idx}" ${disabledAttr} onclick="answer(${i},${qIdx},${idx})">${markHtml}${opt}</button>`;
    }).join('');
    const questionBlock = q.format === 'situation'
      ? `<div class="q-head"><div class="q-situation">${q.question}</div>${speakHtml}</div>`
      : `<div class="q-head"><div class="q-text">${q.question}</div>${speakHtml}</div>`;
    bodyHtml = `
      ${questionBlock}
      <div class="${optClass}" id="opt-wrap" role="group" aria-label="Choix de réponse">${optionsHtml}</div>
    `;
    if(alreadyAnswered){
      const correct = chosenIdx === q.correct;
      feedbackCls = 'show ' + (correct ? 'good' : 'bad');
      const title = correct
        ? icon('checkCircle') + ' <span>Bonne réponse !</span>'
        : icon('xCircle') + ' <span>Pas tout à fait</span>';
      feedbackContent = `<div class="fb-title">${title}</div>${q.explication}<div class="right-info"><strong>Ton droit ici&nbsp;:</strong> ${q.droit}</div>`;
    }
  }

  const consigneHtml = state.consigneSeen ? '' : `
    <div class="consigne" id="consigne" role="region" aria-label="Consigne du jeu">
      <div class="consigne-ico" aria-hidden="true">${icon('bulb')}</div>
      <div class="consigne-body">
        <strong>Consigne</strong>
        <p>Lis la question, choisis ta réponse, puis lis l'explication : chaque réponse t'apprend un droit. Il n'y a pas de note et tu avances à ton rythme. Utilise « Question suivante » pour continuer, ou « Question précédente » pour revenir en arrière.</p>
        <button type="button" class="consigne-btn" onclick="dismissConsigne()">${icon('check')} J'ai compris</button>
      </div>
    </div>`;

  return `
    ${consigneHtml}
    ${globalProgressHtml()}
    <div class="chapter-bar">${chapterChipsHtml(i)}</div>
    <div class="route-strip" role="img" aria-label="Progression : étape ${i+1} sur ${stations.length}">${routeStripHtml(i)}</div>
    <div class="sheet" id="station-sheet">
      <div class="stamp-mark ${isStationDone ? 'show' : ''}" id="stamp" aria-hidden="true">VALIDÉ<br>${icon('star')}</div>
      <div class="station-eyebrow">
        <span class="station-num">ÉTAPE ${s.num} / ${stations.length}</span>
        <span class="label">${s.categorie}</span>
      </div>
      <div class="station-head-row">
        <div class="station-illustration" style="background:${stationColor(s)};" aria-hidden="true">${icon(stationIllustrations[s.num])}</div>
        <h2 class="station-title" id="station-title" tabindex="-1" data-focus="1">${s.title}</h2>
      </div>
      <div class="station-eyebrow">
        <span class="q-progress">Question ${qIdx+1} / ${s.questions.length}</span>
        <span class="format-tag ${q.format}">${formatLabel[q.format]}</span>
      </div>
      ${bodyHtml}
      <div class="feedback ${feedbackCls}" id="feedback" tabindex="-1" aria-label="Explication de la réponse">${feedbackContent}</div>
      <div class="step-nav">
        <button class="prev-step-btn ${showPrevBtn ? 'show' : ''}" onclick="prevStep(${i},${qIdx})">${icon('arrowLeft')} Question précédente</button>
        <button class="next-btn ${alreadyAnswered ? 'show' : ''}" id="next-btn" onclick="nextStep(${i},${qIdx})">${nextLabel(i,qIdx)}</button>
      </div>
    </div>
  `;
}

function dismissConsigne(){
  state.consigneSeen = true;
  const el = document.getElementById('consigne');
  if(el) el.remove();
  const t = document.getElementById('station-title');
  if(t) t.focus();
}

function allStationsDone(){
  return stations.every((_, idx) => !!state.done[idx]);
}

/* Borne [début, fin] du chapitre auquel appartient la station i. Utilisé pour
   ne jamais faire déborder la progression automatique sur le chapitre suivant :
   une équipe qui choisit un chapitre doit y rester jusqu'à la fin de CE
   chapitre, pas être entraînée malgré elle dans le chapitre d'après. */
function currentChapterRange(i){
  const s = stations[i];
  const c = chapters.find(ch => ch.id === s.chapter);
  return c ? c.stationRange : [i, i];
}

function nextLabel(i, qIdx){
  const s = stations[i];
  if(qIdx < s.questions.length - 1) return icon('arrowRight') + " Question suivante";
  const [, chapEnd] = currentChapterRange(i);
  if(i === chapEnd){
    return allStationsDone() ? "Voir le passeport des droits" : icon('arrowRight') + " Retour aux chapitres";
  }
  return icon('arrowRight') + " Étape suivante";
}

function refreshNextButtonLabel(i, qIdx){
  const btn = document.getElementById('next-btn');
  if(btn) btn.innerHTML = nextLabel(i, qIdx);
}

function prevTarget(i, qIdx){
  if(qIdx > 0) return { i: i, q: qIdx - 1 };
  const [chapStart] = currentChapterRange(i);
  /* On ne remonte jamais avant la première station du chapitre choisi :
     sinon "Précédent" ferait entrer dans le chapitre précédent, qui n'a
     peut-être jamais été choisi par l'équipe. */
  if(i > chapStart) return { i: i - 1, q: stations[i-1].questions.length - 1 };
  return null; /* déjà sur la toute première question du chapitre : "précédent" ramène à l'accueil */
}

function prevStep(i, qIdx){
  const target = prevTarget(i, qIdx);
  if(target && state.progress[target.i + '-' + target.q]) return; /* question précédente déjà terminée : on n'y revient pas */
  if(qIdx > 0){
    state.qIndex = qIdx - 1;
  } else if(target){
    state.current = target.i;
    state.qIndex = target.q;
  } else {
    state.screen = 'entry';
  }
  render(false);
}

function revealDebate(i, qIdx){
  const key = i + '-' + qIdx;
  if(state.progress[key]) return; /* éclairage déjà révélé : verrouillé, on ignore tout nouveau clic */
  state.answers[key] = 'revealed';
  const s = stations[i];
  const q = s.questions[qIdx];
  const revealBtn = document.getElementById('debate-reveal');
  if(revealBtn) revealBtn.style.display = 'none';
  const fb = document.getElementById('feedback');
  fb.classList.add('show','neutral');
  fb.innerHTML = `<div class="fb-title">${icon('chat')} <span>À retenir</span></div>${q.explication}<div class="right-info"><strong>Ton droit ici&nbsp;:</strong> ${q.droit}</div>`;
  markQuestionDone(i, qIdx, true);
  refreshNextButtonLabel(i, qIdx);
  document.getElementById('next-btn').classList.add('show');
  fb.focus();
}

function optMarkHtml(type){
  const label = type === 'correct' ? 'Bonne réponse' : 'Mauvaise réponse';
  const ico = type === 'correct' ? icon('checkCircle') : icon('xCircle');
  return '<span class="opt-mark" aria-hidden="true">' + ico + '</span><span class="sr-only">' + label + ' : </span>';
}
function setOptMark(btn, type){
  clearOptMark(btn);
  btn.insertAdjacentHTML('afterbegin', optMarkHtml(type));
}
function clearOptMark(btn){
  btn.querySelectorAll('.opt-mark, .sr-only').forEach(el => el.remove());
}

function answer(stationIdx, qIdx, choiceIdx){
  const key = stationIdx + '-' + qIdx;
  if(state.progress[key]) return; /* question déjà répondue : verrouillée, on ignore tout nouveau clic */
  const s = stations[stationIdx];
  const q = s.questions[qIdx];
  const buttons = document.querySelectorAll('#opt-wrap .opt-btn');
  buttons.forEach(b => b.disabled = true);

  state.answers[key] = choiceIdx;
  const correct = choiceIdx === q.correct;
  buttons[choiceIdx].classList.add(correct ? 'correct' : 'wrong');
  setOptMark(buttons[choiceIdx], correct ? 'correct' : 'wrong');
  if(!correct){
    buttons[q.correct].classList.add('correct');
    setOptMark(buttons[q.correct], 'correct');
  }

  const fb = document.getElementById('feedback');
  fb.classList.add('show', correct ? 'good' : 'bad');
  const title = correct
    ? icon('checkCircle') + ' <span>Bonne réponse !</span>'
    : icon('xCircle') + ' <span>Pas tout à fait</span>';
  fb.innerHTML = `<div class="fb-title">${title}</div>${q.explication}<div class="right-info"><strong>Ton droit ici&nbsp;:</strong> ${q.droit}</div>`;

  markQuestionDone(stationIdx, qIdx, correct);
  refreshNextButtonLabel(stationIdx, qIdx);
  document.getElementById('next-btn').classList.add('show');
  fb.focus();

  if(!correct){
    const wrongBtn = buttons[choiceIdx];
    setTimeout(() => {
      buttons.forEach((b, idx) => { if(idx !== q.correct) b.disabled = false; });
      wrongBtn.classList.remove('wrong');
      clearOptMark(wrongBtn);
    }, 1400);
  }
}

function markQuestionDone(stationIdx, qIdx, success){
  const key = stationIdx + '-' + qIdx;
  if(!state.progress[key]){
    state.progress[key] = true;
  }
  const s = stations[stationIdx];
  const allDone = s.questions.every((_, idx) => state.progress[stationIdx + '-' + idx]);
  if(allDone){
    state.done[stationIdx] = true;
    const stampEl = document.getElementById('stamp');
    if(stampEl) stampEl.classList.add('show');
  }
  const gp = document.querySelector('.global-progress');
  if(gp) gp.outerHTML = globalProgressHtml();
}

/* Envoie un événement de statistique (GoatCounter) à chaque fois qu'un
   parcours est terminé en entier, en plus du comptage de visites classique.
   N'envoie rien si le script de stats n'est pas chargé (ex. en local). */
function trackCourseCompleted(){
  try{
    if(window.goatcounter && typeof window.goatcounter.count === 'function'){
      window.goatcounter.count({
        path: 'parcours-termine',
        title: 'Parcours terminé',
        event: true
      });
    }
  }catch(e){}
}

function nextStep(i, qIdx){
  const s = stations[i];
  const [, chapEnd] = currentChapterRange(i);
  if(qIdx < s.questions.length - 1){
    state.qIndex = qIdx + 1;
  } else if(i < chapEnd){
    /* Encore une station à faire dans CE chapitre : on continue, sans jamais
       déborder sur le chapitre suivant (sinon une équipe qui a choisi un
       chapitre se retrouve à compléter le suivant sans l'avoir choisi, et
       le retrouve ensuite déjà "terminé" quand elle veut vraiment le jouer). */
    state.current = i + 1;
    state.qIndex = 0;
  } else if(allStationsDone()){
    /* Toutes les stations sont validées : le parcours est vraiment terminé. */
    state.screen = 'final';
    trackCourseCompleted();
    render(false);
    return;
  } else {
    /* Fin du chapitre en cours, mais d'autres chapitres n'ont pas encore
       été faits : on renvoie choisir le chapitre suivant plutôt que d'y
       entrer automatiquement. */
    state.screen = 'entry';
    render(false);
    return;
  }
  render(false);
}

/* ---------- FINAL ---------- */

      <div class="rights-list">${items}</div>
      <div class="cert-box">
        <div class="label cert-label">${icon('medal')} Ton certificat personnalisé</div>

        </div>

      <div class="qr-frame">

      </div>

      <div class="how-steps" aria-label="Comment jouer">
        <div class="how-step"><span class="how-ico" aria-hidden="true">${icon('qr')}</span><span>Scanne le code</span></div>
        <div class="how-step"><span class="how-ico" aria-hidden="true">${icon('flag')}</span><span>Choisis un chapitre</span></div>
        <div class="how-step"><span class="how-ico" aria-hidden="true">${icon('checkCircle')}</span><span>Réponds et progresse</span></div>
      </div>

    <button class="restart-btn" onclick="restart()">Recommencer le parcours</button>

}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Sur mobile (surtout Safari iOS, mais aussi certains navigateurs integres
   Android), le telechargement direct via un lien <a download> est souvent
   silencieusement ignore : rien ne se passe, aucun fichier n'apparait nulle
   part. La methode fiable sur tous les telephones consiste a ouvrir le PDF
   dans un nouvel onglet : le telephone affiche alors sa visionneuse PDF native,
   avec un bouton "Partager" / "Enregistrer" pour le sauvegarder. */
function isMobileDevice(){
  return /Android|iPhone|iPad|iPod|Mobile|webOS/i.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); /* iPad recents */
}

function exportPdfFromZone(pdfOptions, zone, filename, btn){
  const mobile = isMobileDevice();

  const cleanup = () => {
    zone.innerHTML = '';
    if(btn){ btn.disabled = false; btn.innerHTML = btn.dataset.originalText; }
  };

  /* Sur ordinateur : méthode d'origine (.save()), fiable et déjà éprouvée,
     on n'y touche pas. */
  if(!mobile){
    try{
      html2pdf().set(pdfOptions).from(zone).save().then(cleanup).catch(() => {
        cleanup();
        alert("La génération du PDF a échoué. Vérifie ta connexion internet et réessaie.");
      });
    }catch(e){
      cleanup();
      alert("La génération du PDF a échoué. Vérifie ta connexion internet et réessaie.");
    }
    return;
  }

  /* Sur mobile : le téléchargement direct via <a download> est souvent
     ignoré silencieusement. On ouvre le PDF dans un nouvel onglet à la
     place (visionneuse native du téléphone, avec bouton Partager/Enregistrer).
     La fenêtre doit être ouverte tout de suite, pendant le clic de
     l'utilisateur : si on attend la fin de la génération (asynchrone), le
     navigateur mobile bloque l'ouverture comme un pop-up indésirable. */
  const popupWin = window.open('', '_blank');
  if(popupWin) popupWin.document.write('<p style="font-family:sans-serif; padding:24px;">Préparation de ton PDF...</p>');

  const fail = () => {
    if(popupWin && !popupWin.closed) popupWin.close();
    cleanup();
    alert("La génération du PDF a échoué. Vérifie ta connexion internet, autorise les pop-up pour ce site si ton téléphone les bloque, puis réessaie.");
  };

  try{
    html2pdf().set(pdfOptions).from(zone).outputPdf('blob').then(blob => {
      const url = URL.createObjectURL(blob);
      if(popupWin && !popupWin.closed){
        popupWin.location.href = url;
      } else {
        window.open(url, '_blank');
      }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      cleanup();
    }).catch(fail);
  }catch(e){
    fail();
  }
}

function downloadCertificate(){
  const input = document.getElementById('cert-prenom-input');
  const prenom = input.value.trim();
  if(!prenom){
    input.style.borderColor = 'var(--accent-coral)';
    input.focus();
    return;
  }
  state.prenom = prenom;
  const btn = event && event.target ? event.target.closest('button') : null;
  if(btn){ btn.disabled = true; btn.dataset.originalText = btn.innerHTML; btn.innerHTML = 'Génération du PDF…'; }

  const zone = document.getElementById('pdf-zone');
  zone.innerHTML = buildCertificateInner(prenom);
  zone.style.width = '760px';

  const filename = 'certificat-' + prenom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-') + '.pdf';

  exportPdfFromZone({
    margin: 0,
    filename: filename,
    image: { type:'jpeg', quality:0.98 },
    html2canvas: { scale:2, backgroundColor:'#ffffff', useCORS:true },
    jsPDF: { unit:'pt', format:'a4', orientation:'landscape' }
  }, zone, filename, btn);
}

function buildCertificateInner(prenom){
  const safePrenom = escapeHtml(prenom);
  const dateStr = new Date().toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
  return `
    <div style="font-family:'Nunito','Segoe UI',sans-serif; background:#FFF7EC; padding:40px; box-sizing:border-box;">
      <div style="max-width:100%; background:#ffffff; border:6px solid #C23B22; border-radius:28px; padding:48px 40px; text-align:center; position:relative; box-shadow:0 10px 0 #E8D2AE;">
        <div style="position:absolute; inset:14px; border:2.5px dashed #FFC93C; border-radius:18px; pointer-events:none;"></div>
        <div style="text-transform:uppercase; letter-spacing:2px; font-weight:800; color:#0A5F51; font-size:14px; margin-bottom:10px;">Certificat de participation</div>
        <div style="width:86px; height:86px; margin:10px auto 20px; border-radius:50%; background:linear-gradient(145deg,#FFC93C,#C23B22); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 #9C2E19;">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9 14.5L7 22l5-3 5 3-2-7.5"/></svg>
        </div>
        <h1 style="font-family:'Fredoka','Nunito',sans-serif; font-size:32px; color:#2B2440; margin:0 0 6px;">Bravo</h1>
        <div style="font-family:'Fredoka','Nunito',sans-serif; font-size:36px; color:#C23B22; margin:10px 0 20px; word-break:break-word;">${safePrenom}</div>
        <p style="color:#5A5266; font-weight:600; font-size:16px; max-width:520px; margin:0 auto 28px; line-height:1.6;">a terminé avec succès Le Parcours RQTH — ${stations.length} étapes et ${totalQuestions()} questions sur les droits des jeunes en situation de handicap.</p>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:32px; padding-top:18px; border-top:2px dashed #E8D2AE; font-size:13px; color:#5A5266; font-weight:700;">
          <span>${dateStr}</span>
          <span>Handi'Games — UGECAM Centre La Mollière</span>
        </div>
      </div>
    </div>`;
}

function buildRecapInner(){
  const sections = stations.map(s => {
    const qs = s.questions.map((q, idx) => {
      const reponseHtml = (q.format === 'debat')
        ? ''
        : `<p style="background:#FFEDD6; padding:8px 12px; border-radius:8px; display:inline-block; margin:0 0 8px;"><strong>Bonne réponse :</strong> ${q.options[q.correct]}</p>`;
      return `
        <div style="margin-bottom:18px; padding-bottom:16px; border-bottom:1px dashed #E8D2AE; page-break-inside:avoid;">
          <p style="font-weight:700; margin:0 0 8px;">${idx+1}. ${q.question}</p>
          ${reponseHtml}
          <p style="color:#5A5266; margin:0 0 8px;">${q.explication}</p>
          <p style="background:#E3F3F0; border-left:4px solid #0E7C6B; padding:10px 14px; border-radius:0 8px 8px 0; margin:0;"><strong style="color:#0A5F51;">Ton droit :</strong> ${q.droit}</p>
        </div>`;
    }).join('');
    return `
      <section style="page-break-inside:avoid; margin-bottom:8px;">
        <h2 style="font-family:'Fredoka','Nunito',sans-serif; font-size:18px; color:#C23B22; border-bottom:2px solid #E8D2AE; padding-bottom:6px; margin:28px 0 14px;">Étape ${s.num} — ${s.title}</h2>
        ${qs}
      </section>`;
  }).join('');

  return `
    <div style="font-family:'Nunito','Segoe UI',sans-serif; max-width:100%; padding:8px 4px 24px; color:#2B2440; line-height:1.55; background:#ffffff; box-sizing:border-box;">
      <h1 style="font-family:'Fredoka','Nunito',sans-serif; font-size:26px; margin:0 0 4px;">Le Parcours RQTH — Récapitulatif</h1>
      <p style="color:#5A5266; font-weight:600; margin:0 0 24px;">Toutes les bonnes réponses, les explications et tes droits — à garder pour toi après l'atelier.</p>
      ${sections}
    </div>`;
}

function downloadRecap(){
  const btn = event && event.target ? event.target.closest('button') : null;
  if(btn){ btn.disabled = true; btn.dataset.originalText = btn.innerHTML; btn.innerHTML = 'Génération du PDF…'; }

  const zone = document.getElementById('pdf-zone');
  zone.innerHTML = buildRecapInner();
  zone.style.width = '760px';

  exportPdfFromZone({
    margin: [28, 24],
    filename: 'recap-parcours-rqth.pdf',
    image: { type:'jpeg', quality:0.98 },
    html2canvas: { scale:2, backgroundColor:'#ffffff', useCORS:true },
    jsPDF: { unit:'pt', format:'a4', orientation:'portrait' },
    pagebreak: { mode:['css','avoid-all'] }
  }, zone, 'recap-parcours-rqth.pdf', btn);
}

function restart(){
  history = [];
  updateBackButton();
  state = { mode:'player', screen:'entry', current:0, qIndex:0, done:{}, progress:{}, answers:{}, prenom:'', consigneSeen:false };
  facUnlocked = false;
  render(false);
}

/* ===================== MODE ANIMATEUR ===================== */

function renderFacilitator(){
  const agendaHtml = agendaPlan.map((a, idx) => `
    <button class="agenda-item" aria-pressed="${idx === activeAgendaIdx}" onclick="selectAgenda(${idx})">
      <div class="agenda-time">${a.time}</div>
      <div class="agenda-body"><strong>${a.title}</strong><p>${a.desc}</p></div>
    </button>`).join('');

  return `
    <div class="fac-header">
      <div>
        <h1 tabindex="-1" data-focus="1">Déroulé d'atelier — 1h</h1>
        <p>Le Parcours RQTH · 12 étapes · ${totalQuestions()} questions · sensibilisation aux droits des jeunes pouvant prétendre à la RQTH.</p>
      </div>
      <div class="timer-box">
        <div class="t-label">TEMPS RESTANT</div>
        <div class="t-val" id="timer-display" aria-live="off">${formatTime(timer.seconds)}</div>
        <div class="t-controls">
          <button onclick="toggleTimer()" id="timer-toggle">${timer.running ? 'Pause' : 'Démarrer'}</button>
          <button onclick="resetTimer()">Réinitialiser</button>
        </div>
      </div>
    </div>

    <div class="agenda" role="group" aria-label="Déroulé de l'atelier">${agendaHtml}</div>

    <div class="sheet" id="fac-detail">
      <div class="label">Note d'animation</div>
      <h3 style="margin-top:0.4rem;">${agendaPlan[activeAgendaIdx].title}</h3>
      <p style="color:var(--text-secondary); margin-top:0.5rem;">${agendaPlan[activeAgendaIdx].detail}</p>
    </div>

    <div class="sheet fac-qr">
      <div class="label">${icon('qr')} QR code du parcours</div>
      <h3>À afficher ou projeter aux jeunes</h3>
      <div class="qr-frame qr-frame-lg">
        <img class="qr-block" src="${QR_IMG}" alt="QR code du jeu de piste RQTH à faire scanner aux participants">
      </div>
      <div class="fac-qr-url">${QR_URL_LABEL}</div>
    </div>

    <div class="printable-note">
      <strong>Un seul QR code pour tout le parcours :</strong> celui de l'affiche de présentation (« Le Jeu de Piste RQTH : Votre Guide d'Aventure »). Affiche-le ou projette-le en début d'atelier : les jeunes le scannent, choisissent un chapitre et progressent dans les 12 étapes depuis leur téléphone. Les étapes de débat (3, 7, 10) gagnent à se faire dans un coin plus calme de la salle pour permettre l'échange en équipe.
    </div>
  `;
}

function selectAgenda(idx){
  activeAgendaIdx = idx;
  render(false);
  const btns = document.querySelectorAll('.agenda-item');
  if(btns[idx]) btns[idx].focus();
}

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function toggleTimer(){
  timer.running = !timer.running;
  if(timer.running){
    timer.interval = setInterval(() => {
      if(timer.seconds > 0){
        timer.seconds--;
        const d = document.getElementById('timer-display');
        if(d) d.textContent = formatTime(timer.seconds);
      } else {
        clearInterval(timer.interval);
        timer.running = false;
      }
    }, 1000);
  } else {
    clearInterval(timer.interval);
  }
  const btn = document.getElementById('timer-toggle');
  if(btn) btn.textContent = timer.running ? 'Pause' : 'Démarrer';
}

function resetTimer(){
  clearInterval(timer.interval);
  timer.running = false;
  timer.seconds = 3600;
  render(false);
}

/* ===================== INIT ===================== */
loadPrefs();
cleanStartUrl();
updateBackButton();
render(false);
initialised = true;
lastFocusKey = currentViewKey();
</script>
